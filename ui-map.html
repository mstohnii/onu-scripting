<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ui-map</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;padding:32px 24px;max-width:900px;margin-left:auto;margin-right:auto;background:#f7f8fa;color:#1f2937;line-height:1.5}
    h1{margin:0 0 10px;font-size:28px;font-weight:600;color:#111827;letter-spacing:-0.01em}
    h2{font-size:18px;font-weight:600;color:#111827;margin:24px 0 8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
    a.btn{display:block;text-decoration:none;border:1px solid #e5e7eb;border-radius:12px;padding:16px;background:#fff;color:#1f2937;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .15s ease}
    a.btn:hover{border-color:#2563eb;color:#2563eb;transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.12)}
    .muted{opacity:.7;color:#4b5563}
    pre{background:#f3f4f6;padding:12px;border-radius:10px;overflow:auto;font-size:13px;color:#374151;border:1px solid #e5e7eb}
  </style>
</head>
<body>
  <h1>ui-map</h1>
  <div class="muted" id="subtitle">—</div>

  <div class="grid">
    <a class="btn" href="p1.html">P1 — вибір курсу</a>
    <a class="btn" href="p2.html">P2 — теми</a>
    <a class="btn" href="p3.html">P3 — питання</a>
    <a class="btn" href="p4.html">P4 — студенти</a>
    <a class="btn" href="p5.html">P5 — література</a>
  </div>

  <h2>Поточний report</h2>
  <pre id="out">(loading...)</pre>

<script>
  const $ = (id) => document.getElementById(id);

  async function loadReport() {
    const courseId = localStorage.getItem('courseId') || '';
    const course = localStorage.getItem('course') || '';
    const duration = localStorage.getItem('duration') || '';

    $('subtitle').textContent = courseId
      ? `${courseId} — ${course} (${duration} год.)`
      : 'courseId не вибрано — поверніться на p1.html';

    if (!courseId) {
      $('out').textContent = 'Немає courseId у localStorage.';
      return;
    }

    const r = await fetch(`api.php?action=getReport&courseId=${encodeURIComponent(courseId)}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'getReport failed');
    $('out').textContent = JSON.stringify(j.data, null, 2);
  }

  loadReport().catch(e => {
    $('out').textContent = 'ERROR: ' + e.message;
  });
</script>
</body>
</html>
